name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-linux
            cc: gcc
            native: true
          - target: aarch64-linux
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
            native: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross toolchain
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Derive version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          make CC=${{ matrix.cc }} \
               VERSION=${{ steps.version.outputs.version }} \
               EXTRA_CFLAGS="-O2 -Werror" \
               LDFLAGS=-static

      - name: Verify the binary
        run: |
          file ./pack
          if [ "${{ matrix.native }}" = "true" ]; then
            ./pack --version
            ./pack --version | grep -q "${{ steps.version.outputs.version }}"
          fi

      - name: Test
        if: matrix.native
        run: make VERSION=${{ steps.version.outputs.version }} test

      - name: Package
        run: |
          name="pack-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp pack README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease) \
            dist/*.tar.gz dist/SHA256SUMS
